<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Bina default">
  <!-- Ears -->
  <circle cx="30" cy="26" r="10" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="26" r="10" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="30" cy="26" r="5" fill="#FDBA74"/>
  <circle cx="70" cy="26" r="5" fill="#FDBA74"/>
  <!-- Body -->
  <ellipse cx="50" cy="82" rx="20" ry="14" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Belly -->
  <ellipse cx="50" cy="82" rx="13" ry="9" fill="#FDBA74"/>
  <!-- Arms -->
  <path d="M30 78 Q24 72 26 66" stroke="#171717" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 78 Q76 72 74 66" stroke="#171717" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="26" cy="65" r="4" fill="#F97316" stroke="#171717" stroke-width="2.5"/>
  <circle cx="74" cy="65" r="4" fill="#F97316" stroke="#171717" stroke-width="2.5"/>
  <!-- Legs -->
  <ellipse cx="38" cy="94" rx="8" ry="5" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="62" cy="94" rx="8" ry="5" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="50" cy="46" r="24" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Muzzle -->
  <ellipse cx="50" cy="52" rx="10" ry="7" fill="#FDBA74" stroke="#171717" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="38" cy="42" r="4" fill="#171717"/>
  <circle cx="62" cy="42" r="4" fill="#171717"/>
  <circle cx="39.5" cy="40.5" r="1.5" fill="white"/>
  <circle cx="63.5" cy="40.5" r="1.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="30" cy="52" r="5" fill="#FDBA74" opacity="0.7"/>
  <circle cx="70" cy="52" r="5" fill="#FDBA74" opacity="0.7"/>
  <!-- Nose -->
  <ellipse cx="50" cy="50" rx="3" ry="2" fill="#171717"/>
  <!-- Mouth -->
  <path d="M47 54 Q50 57 53 54" stroke="#171717" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>