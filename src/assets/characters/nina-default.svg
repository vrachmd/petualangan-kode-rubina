<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nina default">
  <!-- Ears -->
  <polygon points="30,30 22,10 40,24" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="70,30 78,10 60,24" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="31,28 25,14 38,24" fill="#BAE6FD"/>
  <polygon points="69,28 75,14 62,24" fill="#BAE6FD"/>
  <!-- Tail -->
  <path d="M76 72 Q95 60 92 48 Q88 42 80 50" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M88 48 Q85 44 80 50" fill="#FFFFFF"/>
  <!-- Body -->
  <ellipse cx="50" cy="82" rx="18" ry="14" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="50" cy="84" rx="10" ry="8" fill="#FFFFFF"/>
  <!-- Arms -->
  <path d="M32 78 Q26 72 28 66" stroke="#171717" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M68 78 Q74 72 72 66" stroke="#171717" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="65" r="4" fill="#F97316" stroke="#171717" stroke-width="2.5"/>
  <circle cx="72" cy="65" r="4" fill="#F97316" stroke="#171717" stroke-width="2.5"/>
  <!-- Legs -->
  <ellipse cx="40" cy="94" rx="7" ry="5" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="60" cy="94" rx="7" ry="5" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head -->
  <circle cx="50" cy="46" r="24" fill="#F97316" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- White muzzle -->
  <ellipse cx="50" cy="54" rx="12" ry="9" fill="#FFFFFF" stroke="#171717" stroke-width="1.5"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="44" rx="3.5" ry="4.5" fill="#171717"/>
  <ellipse cx="62" cy="44" rx="3.5" ry="4.5" fill="#171717"/>
  <circle cx="39.5" cy="42.5" r="1.5" fill="white"/>
  <circle cx="63.5" cy="42.5" r="1.5" fill="white"/>
  <!-- Cheeks -->
  <circle cx="30" cy="52" r="4.5" fill="#BAE6FD" opacity="0.7"/>
  <circle cx="70" cy="52" r="4.5" fill="#BAE6FD" opacity="0.7"/>
  <!-- Nose -->
  <ellipse cx="50" cy="52" rx="2.5" ry="2" fill="#171717"/>
  <!-- Mouth -->
  <path d="M47 56 Q50 59 53 56" stroke="#171717" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>