<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Rina default">
  <!-- Antenna -->
  <line x1="50" y1="20" x2="50" y2="30" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="17" r="5" fill="#FACC15" stroke="#171717" stroke-width="2.5"/>
  <!-- Ears/bolts -->
  <rect x="22" y="42" width="8" height="14" rx="4" fill="#E9D5FF" stroke="#171717" stroke-width="2"/>
  <rect x="70" y="42" width="8" height="14" rx="4" fill="#E9D5FF" stroke="#171717" stroke-width="2"/>
  <!-- Body -->
  <rect x="30" y="68" width="40" height="24" rx="8" fill="#A855F7" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chest light -->
  <circle cx="50" cy="78" r="4" fill="#FACC15" stroke="#171717" stroke-width="2"/>
  <!-- Arms -->
  <rect x="18" y="70" width="10" height="18" rx="5" fill="#E9D5FF" stroke="#171717" stroke-width="2"/>
  <rect x="72" y="70" width="10" height="18" rx="5" fill="#E9D5FF" stroke="#171717" stroke-width="2"/>
  <!-- Legs -->
  <rect x="36" y="90" width="10" height="10" rx="3" fill="#A855F7" stroke="#171717" stroke-width="2"/>
  <rect x="54" y="90" width="10" height="10" rx="3" fill="#A855F7" stroke="#171717" stroke-width="2"/>
  <!-- Head -->
  <rect x="26" y="30" width="48" height="36" rx="14" fill="#E9D5FF" stroke="#171717" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes -->
  <rect x="34" y="42" width="12" height="14" rx="6" fill="#A855F7" stroke="#171717" stroke-width="2"/>
  <rect x="54" y="42" width="12" height="14" rx="6" fill="#A855F7" stroke="#171717" stroke-width="2"/>
  <circle cx="39" cy="48" r="2.5" fill="white"/>
  <circle cx="59" cy="48" r="2.5" fill="white"/>
  <!-- Mouth -->
  <rect x="40" y="60" width="20" height="4" rx="2" fill="#171717"/>
</svg>